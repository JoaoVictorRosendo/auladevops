name: integracao e entrega continua - staging

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar ESLint
        run: npm install --no-save eslint

      - name: Criar configuração do ESLint
        run: node -e "require('fs').writeFileSync('eslint.config.js', 'module.exports=[{files:[\"**/*.js\"],ignores:[\"node_modules/**\",\".git/**\"],languageOptions:{ecmaVersion:2021,sourceType:\"commonjs\",globals:{process:\"readonly\",console:\"readonly\",__dirname:\"readonly\",__filename:\"readonly\",require:\"readonly\",module:\"readonly\",exports:\"writable\",Buffer:\"readonly\",setTimeout:\"readonly\",clearTimeout:\"readonly\",setInterval:\"readonly\",clearInterval:\"readonly\",global:\"readonly\"}},rules:{"no-unused-vars\":\"warn\",\"no-undef\":\"error\"}}];')"

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.inclusions=**/*.js" >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  job_trivy:
    needs: job_sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar Trivy para scan de vulnerabilidades (Filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Irá falhar a pipeline se encontrar vulnerabilidades críticas ou altas

  job_release:
    needs: job_trivy
    runs-on: ubuntu-latest
    permissions:
      contents: write # Obrigatório para criar a release no repositório
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar tag e release automática de Staging
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "staging-v${{ github.run_number }}"
          prerelease: true
          title: "Release de Staging - Build #${{ github.run_number }}"

  job_deploy_ec2:
    needs: job_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar comandos de deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Altere para o caminho correto da sua aplicação na EC2
            cd /home/ubuntu/sua-aplicacao-faculdade
            
            # Puxa o código atualizado da branch staging
            git pull origin staging
            
            # Instala dependências de produção e reinicia o serviço
            npm install --production
            
            # Exemplo de reinício de app usando o PM2 (ajuste conforme seu projeto)
            pm2 restart meu-projeto || npm run start &
