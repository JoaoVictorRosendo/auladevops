name: integracao e entrega continua - staging

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  estagio_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tortos
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    needs: estagio_build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tortos
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar dependências e ESLint
        run: |
          npm install
          npm install --no-save eslint

      - name: Criar configuração do ESLint
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('eslint.config.js', 'module.exports = [{files:[\"**/*.js\"],ignores:[\"node_modules/**\",\".git/**\"],languageOptions:{ecmaVersion:2021,sourceType:\"commonjs\",globals:{process:\"readonly\",console:\"readonly\",__dirname:\"readonly\",__filename:\"readonly\",require:\"readonly\",module:\"readonly\",exports:\"writable\",Buffer:\"readonly\",setTimeout:\"readonly\",clearTimeout:\"readonly\",setInterval:\"readonly\",clearInterval:\"readonly\",global:\"readonly\"}},rules:{\"no-unused-vars\":\"warn\",\"no-undef\":\"error\"}}];');"

      - name: Rodar ESLint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          projectBaseDir: ./tortos
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**

  job_trivy:
    needs: job_sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar Trivy para scan de vulnerabilidades
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'fs'
          scan-ref: './tortos'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  job_release:
    needs: job_trivy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar tag e release automática de Staging
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "staging-v${{ github.run_number }}"
          prerelease: true
          title: "Release de Staging - Build #${{ github.run_number }}"

  job_deploy_ec2:
    needs: job_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/sua-aplicacao-faculdade/tortos
            git pull origin staging
            npm install --production
            pm2 restart meu-projeto || pm2 start index.js --name "meu-projeto"

